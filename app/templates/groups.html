{% extends "entity_base.html" %}

{% block title %}Manage Groups{% endblock %}
{% block subtitle %}Manage groups and edit group details in your current timetable.{% endblock %}

{% block content %}
<main>
  <div class="page-centered-content">
    <section class="card dashboard-card full-width centered-card" id="groupsSection">
      <div class="subheader-row">
        <h2>Groups</h2>
        <button class="ghost-btn" type="button" id="addGroupBtn">Add</button>
      </div>
      <div class="table-wrapper">
        <table class="entity-table" id="groupListTable">
        <thead>
          <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Programs</th>
            <th>Capacity</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
  </div>
</main>
{% endblock %}
