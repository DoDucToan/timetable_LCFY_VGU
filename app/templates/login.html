<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LCFY Timetable Builder - Admin Login</title>
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="stylesheet" href="/static/style.css?v={{ version }}" />
</head>
<body class="login-page-body">
  <div class="page login-page">
    <header class="topbar login-topbar">
      <a class="brand-logo" href="/">
        <img src="{{ url_for('static', path='VGU-Logo.png') }}" alt="LCFY Timetable Builder" />
      </a>
      <p class="muted">Admin login is required to access the timetable builder.</p>
    </header>

    <main class="layout login-layout">
      <section class="card login-card">
        <div class="login-card-header">
          <div>
            <h1>LCFY Timetable Builder</h1>
            <p class="muted">Secure admin access for timetable management.</p>
          </div>
        </div>

        {% if error == 'invalid' %}
        <div class="error-box">Invalid username or password.</div>
        {% endif %}

        <form action="/login" method="post" class="login-form">
          <label>
            <span>Username</span>
            <input type="text" name="username" autocomplete="username" required />
          </label>
          <label>
            <span>Password</span>
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <div class="form-actions">
            <button type="submit" class="primary-btn">Sign in</button>
          </div>
          <div class="guest-action">
            <a href="/guest" class="secondary-btn">Continue as guest</a>
          </div>
        </form>
      </section>

    </main>
  </div>
</body>
</html>
